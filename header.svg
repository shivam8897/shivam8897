<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shivam Dubey · Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE3B3"/>
      <stop offset=".55" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".5">
      <stop offset="0" stop-color="#FFB547" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#223044" stroke-width=".6" opacity=".55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
    <style>
      .edge{fill:none;stroke:#3A4E6D;stroke-width:1.6}
      .live{fill:none;stroke:#5CE1E6;stroke-width:1.8;stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
      .node{fill:#16202E;stroke:#5CE1E6;stroke-width:1.6}
      .ok{stroke:#4ADE80}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
      .name{font:800 76px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-2.5px}
      .mono{font:500 17px Consolas,'SFMono-Regular',Menlo,monospace;fill:#8C9AAE;letter-spacing:.5px}
      .eyebrow{font:600 14px Consolas,'SFMono-Regular',Menlo,monospace;fill:#FFB547;letter-spacing:3px}
      .chip{font:600 13px Consolas,Menlo,monospace}
      .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
      .r2{animation-delay:.15s}.r3{animation-delay:.3s}
      @keyframes flow{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:.25}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- pipeline DAG (right side) -->
    <g transform="translate(700 0)">
      <path class="edge" d="M60 150 C120 150 120 80 180 80"/>
      <path class="edge" d="M60 150 C120 150 120 220 180 220"/>
      <path class="live" d="M180 80 C240 80 240 150 300 150"/>
      <path class="live" d="M180 220 C240 220 240 150 300 150"/>
      <path class="edge" d="M300 150 C350 150 350 95 400 95"/>
      <path class="edge" d="M300 150 C350 150 350 205 400 205"/>

      <g class="pulse"><circle class="node ok" cx="60" cy="150" r="11"/></g>
      <g class="pulse d1"><circle class="node ok" cx="180" cy="80" r="11"/></g>
      <g class="pulse d2"><circle class="node ok" cx="180" cy="220" r="11"/></g>
      <g class="pulse d3"><circle class="node" cx="300" cy="150" r="13"/></g>
      <g class="pulse d4"><circle class="node" cx="400" cy="95" r="10" style="stroke:#94A3B8"/></g>
      <g class="pulse d4"><circle class="node" cx="400" cy="205" r="10" style="stroke:#94A3B8"/></g>

      <text class="chip" x="22" y="186" fill="#4ADE80">extract ✓</text>
      <text class="chip" x="140" y="54" fill="#4ADE80">validate ✓</text>
      <text class="chip" x="142" y="258" fill="#4ADE80">transform ✓</text>
      <text class="chip" x="262" y="190" fill="#5CE1E6">load ▶</text>

      <!-- packets travelling along the live edges -->
      <circle r="4" fill="#FFB547"><animateMotion dur="1.8s" repeatCount="indefinite" path="M180 80 C240 80 240 150 300 150"/></circle>
      <circle r="4" fill="#FFB547"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M180 220 C240 220 240 150 300 150"/></circle>
    </g>

    <!-- paper plane crossing the card -->
    <g>
      <path d="M-14 -9 12 0 -14 9 -9 0Z" fill="#FFB547" stroke="#0A0E14" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-9 0h21L-5 5Z" fill="#000" opacity=".25"/>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M-60 268 C250 290 420 200 620 236 S980 300 1260 180"/>
    </g>

    <!-- text -->
    <text class="eyebrow rise" x="64" y="92">● OPEN TO SOFTWARE ENGINEER ROLES<animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/></text>
    <text class="name rise r2" x="60" y="172" fill="url(#name)">Shivam Dubey</text>
    <text class="mono rise r3" x="64" y="212">Software Engineer · Data Pipelines · Oracle PL/SQL · Airflow · AWS</text>
    <text class="mono rise r3" x="64" y="240" style="fill:#5D6B80;font-size:15px">Senior Application Development Analyst @ Accenture · Hyderabad, India</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#223044"/>
</svg>
